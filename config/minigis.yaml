app:
  title: "MiniGIS Brenzikofen"
map:
  # default view in EPSG:2056 (approximate; verify against the commune boundary)
  center: [2613500, 1185100]
  zoom: 15
basemaps:
  # Vector base maps (swisstopo, Web Mercator tiles, reprojected to LV95 in the browser)
  - id: basiskarte-hell
    title: Basiskarte hell
    style: https://vectortiles.geo.admin.ch/styles/ch.swisstopo.lightbasemap.vt/style.json
    default: true
  - id: basiskarte
    title: Basiskarte farbig
    style: https://vectortiles.geo.admin.ch/styles/ch.swisstopo.basemap.vt/style.json
  - id: luftbild-beschriftet
    title: Luftbild mit Beschriftung
    style: https://vectortiles.geo.admin.ch/styles/ch.swisstopo.imagerybasemap.vt/style.json
  # Raster maps (swisstopo WMTS in LV95)
  - id: farbe
    title: Landeskarte farbig
    layer: ch.swisstopo.pixelkarte-farbe
  - id: grau
    title: Landeskarte grau
    layer: ch.swisstopo.pixelkarte-grau
  - id: luftbild
    title: Luftbild
    layer: ch.swisstopo.swissimage
tree:
  - group: Umwelt
    children:
      - layer: abfallcontainer
      - layer: neophyten
  - group: Tiefbau
    children:
      - layer: strassenzustand
# Road geometries used for snapping (layers with snapToRoads: true).
# All keys are optional; the defaults use swisstopo's base vector tiles.
# snapping:
#   tilejson: https://vectortiles.geo.admin.ch/tiles/ch.swisstopo.base.vt/v1.0.0/tiles.json
#   sourceLayer: transportation
#   exclude: [rail, transit, ferry, path, footway, trail, ...]   # road classes not snapped to
layers:
  abfallcontainer:
    title: Abfallcontainer
    geometry: point            # point | line | polygon
    photos: true
    style:
      color: "#2e7d32"
      radius: 7
      symbolBy: typ              # one symbol per container type
      symbols:
        Glas:            { shape: circle,        color: "#2e7d32" }
        Alu/Blech:       { shape: square,        color: "#78909c" }
        Altöl:           { shape: triangle,      color: "#4e342e" }
        Grüngut:         { shape: pentagon,      color: "#7cb342" }
        Papier:          { shape: square,        color: "#1e88e5" }
        Gebührensäcke:   { shape: diamond,       color: "#fbc02d" }
        Abfall Gemeinde: { shape: hexagon,       color: "#e53935" }
        Neophyten:       { shape: star,          color: "#d81b60" }
        Schlamm:         { shape: triangle-down, color: "#8d6e63" }
    label: nummer              # optional attribute shown as map label / list title
    attributes:
      - { name: nummer,  label: Nummer,      type: text,    required: true }
      - { name: typ,     label: Typ,         type: select,  options: [Glas, Alu/Blech, Altöl, Grüngut, Papier, Gebührensäcke, Abfall Gemeinde, Neophyten, Schlamm] }
      - { name: volumen, label: "Volumen (l)", type: integer }
      - { name: geleert, label: Letzte Leerung, type: date }
      - { name: bemerkung, label: Bemerkung, type: textarea }
  neophyten:
    title: Neophyten
    geometry: polygon
    photos: true
    style: { color: "#c62828", fill: "rgba(198,40,40,0.25)" }
    attributes:
      - { name: art,      label: Art,       type: select, options: [Drüsiges Springkraut, Kanadische Goldrute, Japanischer Staudenknöterich, Andere] }
      - { name: gefunden, label: Gefunden am, type: date, required: true }
      - { name: bekaempft, label: Bekämpft, type: boolean }
      - { name: bemerkung, label: Bemerkung, type: textarea }
  strassenzustand:
    title: Strassenzustand
    geometry: line
    photos: true
    snapToRoads: true          # vertices snap to swisstopo roads (toggle in the edit toolbar)
    style: { color: "#ef6c00" }
    label: strasse
    attributes:
      - { name: strasse,    label: Strasse,       type: text,   required: true }
      - { name: zustand,    label: Zustand,       type: select, required: true, options: [gut, mittel, schlecht, sehr schlecht] }
      - { name: belag,      label: Belag,         type: select, options: [Asphalt, Beton, Pflästerung, Kies, Andere] }
      - { name: schaden,    label: Schadenbild,   type: select, options: [Risse, Schlaglöcher, Spurrinnen, Belagsablösung, Absenkung, Andere] }
      - { name: beurteilt,  label: Beurteilt am,  type: date }
      - { name: massnahme,  label: Massnahme,     type: textarea }
      - { name: bemerkung,  label: Bemerkung,     type: textarea }
