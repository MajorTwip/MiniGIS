services:
  minigis:
    # Published by .github/workflows/build_push.yml on every push to main.
    image: ghcr.io/majortwip/minigis:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./config:/config
    # No published port: the service is reached through Traefik (Authentik protects it).
